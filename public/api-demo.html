<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Demo API · NerdVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<!--
    ESTA PÁGINA ES UN "FRONTEND SEPARADO".
    No usa Blade ni PHP: es HTML + JavaScript puro que corre en el navegador.
    Se comunica con el backend Laravel SOLO a través de la API JSON (/api/...),
    igual que lo haría una app en React, Vue, Angular o una app móvil.
    Abre las DevTools del navegador (F12) → pestaña "Network" para ver cada petición.
-->
<div class="container py-4">
    <h1 class="h3">Frontend en JavaScript consumiendo la API</h1>
    <p class="text-muted">Este HTML no tiene datos: los pide al backend con <code>fetch()</code>. <a href="/">← Volver a la tienda (Blade)</a></p>

    <div class="row g-2 mb-3">
        <div class="col-md-4"><input id="name" class="form-control" placeholder="Buscar por nombre"></div>
        <div class="col-md-4"><select id="category" class="form-select"><option value="">Todas las categorías</option></select></div>
        <div class="col-md-4"><button id="search" class="btn btn-primary w-100">GET /api/products</button></div>
    </div>

    <div id="products" class="row row-cols-1 row-cols-md-3 g-3"></div>

    <h2 class="h5 mt-4">Última respuesta JSON del servidor</h2>
    <pre id="raw" class="bg-dark text-success p-3 rounded small" style="max-height: 320px; overflow:auto"></pre>
</div>

<script>
const API = '/api';            // misma dirección que el backend (mismo origen, sin CORS)
const money = n => '$' + Number(n).toLocaleString('es-CL');

// 1) Pedir categorías al backend: GET /api/categories
async function loadCategories() {
    const res = await fetch(`${API}/categories`, { headers: { Accept: 'application/json' } });
    const json = await res.json();
    for (const c of json.data) {
        document.querySelector('#category').insertAdjacentHTML('beforeend', `<option value="${c.id}">${c.name} (${c.products_count})</option>`);
    }
}

// 2) Pedir productos con filtros: GET /api/products?name=...&category=...
async function loadProducts() {
    const params = new URLSearchParams();
    const name = document.querySelector('#name').value;
    const category = document.querySelector('#category').value;
    if (name) params.set('name', name);
    if (category) params.set('category', category);

    const res = await fetch(`${API}/products?${params}`, { headers: { Accept: 'application/json' } });
    const json = await res.json();
    document.querySelector('#raw').textContent = `GET ${res.url}\nHTTP ${res.status}\n\n` + JSON.stringify(json, null, 2);

    document.querySelector('#products').innerHTML = json.data.map(p => `
        <div class="col"><div class="card h-100"><div class="card-body">
            <span class="badge bg-secondary">${p.category.name}</span>
            ${p.is_on_promotion ? '<span class="badge bg-danger">Promoción</span>' : ''}
            <h3 class="h6 mt-2">${p.name}</h3>
            <p class="small text-muted mb-1">${p.franchise} · stock ${p.stock}</p>
            ${p.is_on_promotion ? `<s class="text-muted">${money(p.price)}</s> ` : ''}<strong>${money(p.final_price)}</strong>
            <button class="btn btn-sm btn-success w-100 mt-2" ${p.available ? '' : 'disabled'} onclick="buy(${p.id})">
                Comprar 1 (POST /api/sales)
            </button>
        </div></div></div>`).join('');
}

// 3) Enviar datos al backend: POST /api/sales con un body JSON
async function buy(productId) {
    const body = {
        customer_name: 'Cliente Demo',
        customer_email: 'demo@example.com',
        card_holder: 'CLIENTE DEMO',
        card_number: '4111111111111111',   // tarjeta de prueba VISA (válida por Luhn)
        card_expiration: '12/30',
        card_cvv: '123',
        items: [{ product_id: productId, quantity: 1 }],
    };

    const res = await fetch(`${API}/sales`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(body),
    });
    const json = await res.json();
    document.querySelector('#raw').textContent = `POST ${res.url}\nHTTP ${res.status}\n\n` + JSON.stringify(json, null, 2);

    if (res.ok) {
        alert(`Venta #${json.data.id} registrada. Total: ${money(json.data.total)}`);
        loadProducts(); // refresca: el stock bajó en la base de datos
    } else {
        alert(`Error ${res.status}: ${json.message}`);
    }
}

document.querySelector('#search').addEventListener('click', loadProducts);
loadCategories().then(loadProducts);
</script>
</body>
</html>
